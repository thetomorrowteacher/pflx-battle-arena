<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evo Avatars</title>
<style>body{margin:0;background:#071025;color:#eef6ff;font:16px system-ui}main{max-width:1400px;margin:auto;padding:28px}h1{margin-bottom:8px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}select{background:#132343;color:white;border:1px solid #457399;border-radius:8px;padding:12px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}article{background:#11203b;border:1px solid #27425f;border-radius:14px;overflow:hidden}img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}h2{font-size:17px;margin:14px}article p{margin:14px;color:#b5c9de}a{color:inherit}#status{color:#a7c8e1}</style>
<main><h1>Evo Avatars</h1><p>Four studios. Ten levels of evolution.</p><nav><label>Studio <select id="studio"><option value="">All studios</option><option value="gentech">Gentech</option><option value="mindforge">MindForge</option><option value="emagination">eMagination</option><option value="innov8">Innov8</option></select></label><label>Level <select id="level"><option value="">All levels</option></select></label></nav><p id="status" role="status">Loading artwork…</p><section id="cards" aria-label="Evo artwork"></section></main>
<script>
const studio=document.querySelector('#studio'),level=document.querySelector('#level'),grid=document.querySelector('#cards'),status=document.querySelector('#status');let cards=[];
function render(){grid.replaceChildren();const selected=cards.filter(c=>(!studio.value||c.studio===studio.value)&&(!level.value||c.level===Number(level.value)));status.textContent=selected.length?`${selected.length} artworks · ${cards.length} imported · later levels may be drafts`:'Artwork for this selection is still in production.';for(const c of selected){const article=document.createElement('article'),a=document.createElement('a'),img=document.createElement('img'),h=document.createElement('h2'),p=document.createElement('p');a.href=c.web||c.src;img.src=c.web||c.src;img.loading='lazy';img.alt=`${c.studio} ${c.buildName}, level ${c.level}`;h.textContent=c.buildName;p.textContent=`${c.studio} · Level ${c.level} · ${c.build} · ${c.productionStatus || "complete"}`;a.append(img);article.append(a,h,p);grid.append(article);}}
fetch('assets/exo/manifest.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()}).then(m=>{if(m.scheme!=='ten-level')throw Error('Ten-level catalog required');cards=Object.values(m.cards).sort((a,b)=>a.level-b.level||a.studio.localeCompare(b.studio)||a.build.localeCompare(b.build));for(const n of m.levels){const o=document.createElement('option');o.value=n;o.textContent=n===10?'10 · Celestial':String(n);level.append(o);}render();}).catch(e=>status.textContent=e.message);studio.addEventListener('change',render);level.addEventListener('change',render);
</script></html>
